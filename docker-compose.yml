name: imperial-estates
services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      MongoDb__ConnectionString: ${MONGODB_CONNECTION_STRING:-mongodb://mongo:27017}
      MongoDb__DatabaseName: ${MONGODB_DATABASE:-imperial_estates}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Jwt__Issuer: ${JWT_ISSUER:-ImperialEstates}
      Jwt__Audience: ${JWT_AUDIENCE:-ImperialEstates.Web}
      Discord__ClientId: ${DISCORD_CLIENT_ID}
      Discord__ClientSecret: ${DISCORD_CLIENT_SECRET}
      Discord__RedirectUri: ${DISCORD_REDIRECT_URI:-http://localhost:5080/api/v1/auth/discord/callback}
      App__FrontendUrl: ${FRONTEND_URL:-http://localhost:4200}
      Zipline__BaseUrl: ${ZIPLINE_BASE_URL}
      Zipline__ApiToken: ${ZIPLINE_API_TOKEN}
      SeedData__Enabled: ${SEED_DATA:-false}
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "5080:8080"
    volumes:
      - uploads:/app/wwwroot/uploads

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  mongo_data:
  uploads:

