<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="description" content="Imperial Estates — considered homes, managed with care." />
    <meta name="theme-color" content="#173f38" />
    <script>
      (() => {
        try {
          const savedTheme = localStorage.getItem('imperial-estates-theme');
          const legacyThemes = {
            light: 'imperial-light',
            dark: 'emerald-dark',
            graphite: 'imperial-dark',
          };
          const palettes = ['imperial', 'ocean', 'emerald', 'violet', 'ruby'];
          const migratedTheme = legacyThemes[savedTheme] || savedTheme;
          const parts = migratedTheme?.split('-') || [];
          const theme =
            palettes.includes(parts[0]) && (parts[1] === 'light' || parts[1] === 'dark')
              ? migratedTheme
              : matchMedia('(prefers-color-scheme: dark)').matches
                ? 'imperial-dark'
                : 'imperial-light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.dataset.palette = theme.split('-')[0];
          document.documentElement.dataset.mode = theme.split('-')[1];
          document.documentElement.style.colorScheme = theme.endsWith('-dark') ? 'dark' : 'light';
        } catch {
          document.documentElement.dataset.theme = 'imperial-light';
          document.documentElement.dataset.palette = 'imperial';
          document.documentElement.dataset.mode = 'light';
        }
      })();
    </script>
    <title>Imperial Estates | Property, thoughtfully managed</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="assets/imperial-estates-logo.png" />
    <link rel="apple-touch-icon" href="assets/imperial-estates-logo.png" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
